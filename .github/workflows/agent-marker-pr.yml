name: Agent marker PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/minimum-simultaneous-markers
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Apply remaining patches
        run: python scripts/apply-marker-filter.py

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Targeted tests
        working-directory: frontend
        run: pnpm exec vitest run src/stores/market-store.test.ts src/components/dashboard/trading-chart.test.ts src/components/dashboard/indicator-toolbar.test.tsx

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/stores/market-store.test.ts \
            frontend/src/components/dashboard/trading-chart.tsx \
            frontend/src/components/dashboard/trading-chart.test.ts \
            frontend/src/components/dashboard/indicator-toolbar.test.tsx
          git commit -m "test: cover simultaneous marker filtering"
          git push origin HEAD:agent/minimum-simultaneous-markers
