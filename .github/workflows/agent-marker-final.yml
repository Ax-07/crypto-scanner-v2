name: Agent marker final validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/minimum-simultaneous-markers
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      - name: Targeted tests
        working-directory: frontend
        run: pnpm exec vitest run src/stores/market-store.test.ts src/components/dashboard/trading-chart.test.ts src/components/dashboard/indicator-toolbar.test.tsx
      - name: Build
        working-directory: frontend
        run: pnpm run build
